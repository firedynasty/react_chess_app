<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Reformatter</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #00d4ff; text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 20px; }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        button {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        .btn-paste { background: #9c27b0; color: white; }
        .btn-copy-plain { background: #28a745; color: white; }
        .btn-copy-oneline { background: #17a2b8; color: white; }
        .btn-clear { background: #6c757d; color: white; }

        .input-area {
            width: 100%;
            min-height: 120px;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            background: #0f3460;
            color: #eee;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 16px;
        }
        .input-area::placeholder { color: #666; }

        .output-panel {
            background: #0f3460;
            border-radius: 8px;
            padding: 20px 24px;
            line-height: 1.7;
            font-size: 15px;
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .output-panel:empty::before {
            content: 'Formatted text will appear here...';
            color: #555;
        }

        .output-panel strong, .output-panel b { color: #00d4ff; }
        .output-panel .numbered-item { margin: 8px 0; }
        .output-panel .section-header {
            color: #ffd43b;
            font-weight: 600;
            display: block;
            margin-top: 16px;
            margin-bottom: 4px;
        }

        .clipboard-history {
            margin-top: 20px;
        }
        .clipboard-history h3 {
            color: #ffd43b;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .clipboard-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            border-radius: 0.25rem;
            background-color: rgb(255, 212, 59);
            transition: background-color 0.2s;
            font-weight: bold;
            box-shadow: rgba(255, 212, 59, 0.5) 0px 0px 5px;
            color: #1a1a2e;
            font-size: 14px;
            word-wrap: break-word;
        }
        .clipboard-item:hover {
            background-color: rgb(255, 225, 100);
        }

        .font-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .font-controls button {
            width: 34px;
            height: 34px;
            padding: 0;
            font-size: 18px;
            font-weight: bold;
            background: #0f3460;
            color: #00d4ff;
            border: 1px solid #00d4ff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .font-controls span {
            color: #888;
            font-size: 13px;
            min-width: 38px;
            text-align: center;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 12px;">
        <a href="/" style="background: linear-gradient(90deg, #9c27b0, #e91e63); color: white; padding: 8px 16px; border-radius: 4px; text-decoration: none; font-size: 14px; font-weight: bold;">Chess Analyzer</a>
        <a href="/looker" style="background: linear-gradient(90deg, #9c27b0, #e91e63); color: white; padding: 8px 16px; border-radius: 4px; text-decoration: none; font-size: 14px; font-weight: bold;">Chess Looker</a>
    </div>
    <h1>Text Reformatter</h1>
    <p class="subtitle">Paste coach responses or any text — view formatted, or copy as one line for Google Sheets</p>

    <div class="toolbar">
        <button class="btn-paste" onclick="pasteFromClipboard()">Paste from Clipboard</button>
        <button class="btn-copy-plain" onclick="copyFormatted()">Copy Formatted</button>
        <button class="btn-copy-oneline" onclick="copyOneLine()">Copy One-Line (Sheets)</button>
        <button class="btn-clear" onclick="clearAll()">Clear</button>
        <div class="font-controls">
            <button onclick="changeFontSize(-1)">−</button>
            <span id="fontSizeLabel">15px</span>
            <button onclick="changeFontSize(1)">+</button>
        </div>
    </div>

    <textarea class="input-area" id="inputArea" placeholder="Paste or type raw text here..."></textarea>

    <div class="output-panel" id="outputPanel"></div>

    <div class="stats">
        <span id="charCount">0 chars</span>
        <span id="wordCount">0 words</span>
    </div>

    <div class="clipboard-history" id="clipboardHistory" style="display:none;">
        <h3>Clipboard History (click to re-copy)</h3>
        <div id="clipboardItems"></div>
    </div>

    <script>
        const inputArea = document.getElementById('inputArea');
        const outputPanel = document.getElementById('outputPanel');

        inputArea.addEventListener('input', () => reformat());

        function reformat() {
            const raw = inputArea.value;
            if (!raw.trim()) {
                outputPanel.innerHTML = '';
                updateStats('');
                return;
            }
            outputPanel.innerHTML = formatText(raw);
            updateStats(raw);
        }

        function formatText(text) {
            // Escape HTML
            let s = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // Bold: **text**
            s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

            // Numbered lists: lines starting with digits followed by period/parenthesis
            s = s.replace(/^(\d+[\.\)]\s*)(.+)$/gm, '<div class="numbered-item"><strong>$1</strong>$2</div>');

            // Lines that end with colon — treat as section headers
            s = s.replace(/^(.+:)\s*$/gm, '<span class="section-header">$1</span>');

            // Insert line break every two sentences (after every 2nd period followed by a space)
            let sentenceCount = 0;
            s = s.replace(/(\.)(\s)/g, function(match, dot, space) {
                sentenceCount++;
                if (sentenceCount % 2 === 0) {
                    return dot + '\n\n';
                }
                return match;
            });

            // Preserve paragraph breaks
            s = s.replace(/\n{2,}/g, '\n\n');

            return s;
        }

        function updateStats(text) {
            document.getElementById('charCount').textContent = text.length.toLocaleString() + ' chars';
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('wordCount').textContent = words.toLocaleString() + ' words';
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                inputArea.value = text;
                reformat();
            } catch (e) {
                alert('Clipboard access denied. Click the page first, then try again.');
            }
        }

        function copyFormatted() {
            const text = inputArea.value.trim();
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                flash('btn-copy-plain', 'Copied!');
                addToClipboardHistory(text);
            });
        }

        function copyOneLine() {
            const text = inputArea.value.trim();
            if (!text) return;
            const oneLine = text.replace(/\n+/g, ' ').replace(/\s{2,}/g, ' ').trim();
            navigator.clipboard.writeText(oneLine).then(() => {
                flash('btn-copy-oneline', 'Copied!');
                addToClipboardHistory(oneLine);
            });
        }

        function clearAll() {
            inputArea.value = '';
            outputPanel.innerHTML = '';
            updateStats('');
        }

        function flash(btnClass, msg) {
            const btn = document.querySelector('.' + btnClass);
            const orig = btn.textContent;
            btn.textContent = msg;
            setTimeout(() => btn.textContent = orig, 1500);
        }

        // Font size controls
        let currentFontSize = 15;
        function changeFontSize(delta) {
            currentFontSize = Math.max(10, Math.min(28, currentFontSize + delta));
            outputPanel.style.fontSize = currentFontSize + 'px';
            inputArea.style.fontSize = currentFontSize + 'px';
            document.getElementById('fontSizeLabel').textContent = currentFontSize + 'px';
        }

        // Clipboard history
        const clipboardItems = [];
        function addToClipboardHistory(text) {
            const preview = text.length > 200 ? text.substring(0, 200) + '...' : text;
            clipboardItems.unshift({ full: text, preview: preview });
            if (clipboardItems.length > 20) clipboardItems.pop();
            renderClipboardHistory();
        }

        function renderClipboardHistory() {
            const container = document.getElementById('clipboardItems');
            const historySection = document.getElementById('clipboardHistory');
            if (clipboardItems.length === 0) {
                historySection.style.display = 'none';
                return;
            }
            historySection.style.display = 'block';
            container.innerHTML = clipboardItems.map((item, i) =>
                `<div class="clipboard-item" onclick="reCopy(${i})" title="Click to copy">${item.preview.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`
            ).join('');
        }

        function reCopy(index) {
            navigator.clipboard.writeText(clipboardItems[index].full).then(() => {
                const items = document.querySelectorAll('.clipboard-item');
                if (items[index]) {
                    items[index].style.backgroundColor = '#28a745';
                    items[index].style.color = 'white';
                    setTimeout(() => {
                        items[index].style.backgroundColor = 'rgb(255, 212, 59)';
                        items[index].style.color = '#1a1a2e';
                    }, 800);
                }
            });
        }
    </script>
</body>
</html>
