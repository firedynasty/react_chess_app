    <div id="extend-variation-container" style="max-width: 1200px; margin: 20px auto; padding: 15px; background: #16213e; border-radius: 8px; border: 1px solid #1a1a2e;">
        <div style="margin-bottom: 10px;">
            <span style="color: #00d4ff; font-weight: bold; font-size: 14px;">📎 Extend Current Variation from Lichess</span>
            <span style="color: #888; font-size: 12px; margin-left: 10px;">(Click on a variation move → Go to Lichess → Paste continuation)</span>
        </div>
        <textarea id="lichess-pgn-input"
            placeholder="Paste Lichess PGN here (e.g., from position: 10... a5 11. Be2 a4)"

            </button>

            <a id="lichessBoard2Link" href="#" target="_blank"
