<!-- Hidden Nav Buttons: Next Var, Back Var, Cycle Clipboard -->
<!-- To restore: add these buttons back to the board2NavContainer div in index.html -->

<!-- Button HTML (place after Cycle Var. button) -->
<button id="nextVarBtn" style="background: #6f42c1; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold;">Next Var.</button>
<button id="backVarBtn" style="background: #17a2b8; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold;">Back Var.</button>
<button id="cycleClipboardBtn" style="background: #e91e63; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold;">Cycle Clipboard</button>

<!-- Event listener JS (place in the DOMContentLoaded init section) -->
<script>
// Next Var. button - jumps to next main-line branch point
const nextVarBtn = document.getElementById('nextVarBtn');
if (nextVarBtn) {
    nextVarBtn.addEventListener('click', nextVariation);
}

// Back Var. button - jumps to previous main-line branch point
const backVarBtn = document.getElementById('backVarBtn');
if (backVarBtn) {
    backVarBtn.addEventListener('click', backVariation);
}

// Cycle Clipboard button - loads from clipboard or cycles through positions
window.lastCycleClipboardContent = null;
const cycleClipboardBtn = document.getElementById('cycleClipboardBtn');
if (cycleClipboardBtn) {
    cycleClipboardBtn.addEventListener('click', async function() {
        try {
            const clipboardText = await navigator.clipboard.readText();
            const trimmedClipboard = clipboardText ? clipboardText.trim() : '';

            // Check if clipboard is same as last loaded content
            if (window.lastCycleClipboardContent && trimmedClipboard === window.lastCycleClipboardContent) {
                // Same content - cycle to next position (loop to start)
                if (window.studyReportPositions && window.studyReportPositions.length > 0) {
                    window.studyReportPositionIndex++;
                    if (window.studyReportPositionIndex >= window.studyReportPositions.length) {
                        window.studyReportPositionIndex = 0; // Loop back to start
                    }
                    if (window.board2) {
                        window.board2.position(window.studyReportPositions[window.studyReportPositionIndex]);
                    }
                    updateBoard2MoveIndicator(window.studyReportPositionIndex);
                }
            } else {
                // New content - load it
                if (!trimmedClipboard) {
                    log('Clipboard is empty', 'warn');
                    return;
                }

                // Store the new clipboard content
                window.lastCycleClipboardContent = trimmedClipboard;

                // Parse the PGN (handles FEN headers automatically)
                if (typeof window.parsePgnToPositions === 'function') {
                    window.studyReportPositions = window.parsePgnToPositions(trimmedClipboard);
                    window.studyReportPositionIndex = 0;

                    if (window.studyReportPositions && window.studyReportPositions.length > 0) {
                        if (window.board2) {
                            window.board2.position(window.studyReportPositions[0]);
                        }
                        updateBoard2MoveIndicator(0);
                        log(`Loaded ${window.studyReportPositions.length} positions from clipboard`, 'success');
                    } else {
                        log('No valid positions found in clipboard', 'warn');
                    }
                }
            }
        } catch (err) {
            console.error('Clipboard read error:', err);
            log('Could not read clipboard', 'error');
        }
    });
}
</script>
